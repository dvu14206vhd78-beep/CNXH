<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chủ Nghĩa Xã Hội - Thời Kỳ Quá Độ</title>
    <style>
      :root {
        --bg1: #89f7fe;
        --bg2: #66a6ff;
        --card: #ffffff;
        --ink: #1f2937;
        --muted: #6b7280;
        --accent: #2563eb;
        --good: #16a34a;
        --bad: #dc2626;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        color: var(--ink);
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 16px 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(22px, 3vw, 30px);
      }
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      button {
        border: none;
        padding: 10px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        background: var(--accent);
        color: #fff;
      }
      button.secondary {
        background: #111827;
      }
      button.ghost {
        background: #fff;
        color: #111827;
        border: 1px solid #ddd;
      }
      .cards {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 20px;
      }
      .card {
        background: var(--card);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      .qhead {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .qidx {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-weight: 700;
        color: #fff;
        background: #111827;
      }
      .qtitle {
        font-weight: 700;
      }
      .hint {
        font-size: 13px;
        color: var(--muted);
        margin-top: 4px;
      }
      .answers {
        margin-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .answers label {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 12px;
        cursor: pointer;
        background: #fff;
      }
      .answers input {
        width: 18px;
        height: 18px;
      }
      .tf-item {
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 12px;
        background: #fff;
        margin-bottom: 8px;
      }
      .tf-row {
        margin-top: 6px;
        display: flex;
        gap: 16px;
      }
      .dragwrap {
        display: grid;
        gap: 12px;
      }
      .dragzone {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      .zone {
        min-height: 64px;
        border: 2px dashed #aaa;
        border-radius: 14px;
        padding: 10px;
        background: #fafafa;
      }
      .pill {
        background: #eef2ff;
        border: 1px solid #99c;
        border-radius: 999px;
        padding: 8px 12px;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        font-weight: 600;
        user-select: none;
        cursor: grab;
        margin: 4px;
      }
      .pool,
      .droparea {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 40px;
      }
      .result {
        margin-top: 12px;
        font-weight: 700;
      }
      .r-good {
        color: var(--good);
      }
      .r-bad {
        color: var(--bad);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1>Chủ Nghĩa Xã Hội & Thời Kỳ Quá Độ</h1>
        <div class="toolbar">
          <button id="btnCheck">Xem kết quả</button>
          <button class="secondary" id="btnReset">Làm lại & đảo câu</button>
          <button class="ghost" id="btnToggleKey">Hiện/ẩn đáp án đúng</button>
          <div class="meta" id="meta">0/0 câu</div>
        </div>
      </div>
    </header>

    <main class="wrap"><div id="list" class="cards"></div></main>

              const id = `q${qi}_${safeId(opt)}`;
              const lab = el("label");
              const ipt = el("input", {
                type: q.type === "single" ? "radio" : "checkbox",
                name: `q${qi}`,
                value: opt,
                id,
              });
              lab.append(ipt, el("span", {}, opt));
              body.append(lab);
            });
          }
          if (q.type === "tfset") {
            q.statements.forEach((st, si) => {
              const row = el("div", { class: "tf-item" });
              row.append(el("div", {}, st.text));
              const ch = el("div", { class: "tf-row" });
              ["Đúng", "Sai"].forEach((v) => {
                const lab = el("label");
                const ipt = el("input", {
                  type: "radio",
                  name: `q${qi}_s${si}`,
                  value: v,
                });
                lab.append(ipt, el("span", {}, v));
                ch.append(lab);
              });
              row.append(ch);
              body.append(row);
            });
          }
          if (q.type === "drag_pairs") {
            const wrap = el("div", { class: "dragwrap" });
            const zones = el("div", { class: "dragzone" });
            q.__right.forEach((r) => {
              const z = el("div", { class: "zone", dataset: { target: r } });
              z.append(el("h4", {}, r), el("div", { class: "droparea" }));
              zones.append(z);
            });
            wrap.append(zones);
            const pool = el("div", { class: "pool" });
            [...q.__left, ...(q.__extras || [])].forEach((l) => {
              pool.append(
                el(
                  "div",
                  { class: "pill", draggable: true, dataset: { txt: l } },
                  l,
                ),
              );
            });
            wrap.append(pool);
            body.append(wrap);
          }
          if (q.type === "drag_groups") {
            const wrap = el("div", { class: "dragwrap" });
            const zones = el("div", { class: "dragzone" });
            q.__groupNames.forEach((g) => {
              const z = el("div", { class: "zone", dataset: { gname: g } });
              z.append(el("h4", {}, g), el("div", { class: "droparea" }));
              zones.append(z);
            });
            wrap.append(zones);
            const pool = el("div", { class: "pool" });
            q.__items.forEach((item) => {
              pool.append(
                el(
                  "div",
                  { class: "pill", draggable: true, dataset: { txt: item } },
                  item,
                ),
              );
            });
            wrap.append(pool);
            body.append(wrap);
          }
          card.append(body, el("div", { class: "result", id: `res_${qi}` }));
          list.append(card);
        });
        enableDragDrop();
      }

      function enableDragDrop() {
        document.querySelectorAll(".pill").forEach((p) => {
          p.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("text/plain", p.dataset.txt);
          });
        });
        document.querySelectorAll(".droparea,.pool").forEach((area) => {
          area.addEventListener("dragover", (e) => e.preventDefault());
          area.addEventListener("drop", (e) => {
            e.preventDefault();
            const txt = e.dataTransfer.getData("text/plain");
            if (!txt) return;
            const old = document.querySelector(
              `.pill[data-txt="${CSS.escape(txt)}"]`,
            );
            if (old) old.remove();
            const pill = el(
              "div",
              { class: "pill", draggable: true, dataset: { txt } },
              txt,
            );
            pill.addEventListener("dragstart", (ev) =>
              ev.dataTransfer.setData("text/plain", txt),
            );
            area.append(pill);
          });
        });
      }

      function getUserAnswer(q, qi) {
        if (q.type === "single" || q.type === "multi") {
          return Array.from(
            document.querySelectorAll(`#q_${qi} input:checked`),
          ).map((x) => x.value);
        }
        if (q.type === "tfset") {
          return q.statements.map((st, si) => {
            const inp = document.querySelector(
              `input[name="q${qi}_s${si}"]:checked`,
            );
            return inp ? inp.value === "Đúng" : null;
          });
        }
        if (q.type === "drag_pairs") {
          const ans = {};
          document.querySelectorAll(`#q_${qi} .zone`).forEach((z) => {
            const target = z.dataset.target;
            const pill = z.querySelector(".pill");
            if (pill) ans[pill.dataset.txt] = target;
          });
          return ans;
        }
        if (q.type === "drag_groups") {
          const ans = {};
          document.querySelectorAll(`#q_${qi} .zone`).forEach((z) => {
            const gname = z.dataset.gname;
            ans[gname] = Array.from(z.querySelectorAll(".pill")).map(
              (p) => p.dataset.txt,
            );
          });
          return ans;
        }
        return null;
      }

      function isCorrect(q, ans) {
        if (!ans) return false;
        if (q.type === "single" || q.type === "multi") {
          return (
            ans.length === q.answer.length &&
            ans.every((a) => q.answer.includes(a))
          );
        }
        if (q.type === "tfset") {
          return ans.every((a, i) => a === q.statements[i].answer);
        }
        if (q.type === "drag_pairs") {
          return Object.entries(q.pairs).every(([l, r]) => ans[l] === r);
        }
        if (q.type === "drag_groups") {
          return Object.entries(q.groups).every(([g, arr]) =>
            arr.every((item) => ans[g] && ans[g].includes(item)),
          );
        }
        return false;
      }

      function showKey(q, qi) {
        const res = document.getElementById(`res_${qi}`);
        res.innerHTML = "";
        if (q.type === "single" || q.type === "multi")
          res.innerHTML = `<div class="hint">Đáp án: <b>${q.answer.join(
            ", ",
          )}</b></div>`;
        if (q.type === "tfset")
          res.innerHTML = `<div class="hint">Đáp án: <b>${q.statements
            .map((s) => (s.answer ? "Đúng" : "Sai"))
            .join(" · ")}</b></div>`;
        if (q.type === "drag_pairs")
          res.innerHTML = `<div class="hint">Đáp án:<br><b>${Object.entries(
            q.pairs,
          )
            .map(([l, r]) => `${l} → ${r}`)
            .join("<br>")}</b></div>`;
        if (q.type === "drag_groups")
          res.innerHTML = `<div class="hint">Đáp án:<br><b>${Object.entries(
            q.groups,
          )
            .map(([g, a]) => `${g}: ${a.join(", ")}`)
            .join("<br>")}</b></div>`;
      }

      function checkAll() {
        let correct = 0;
        WORK.forEach((q, qi) => {
          const res = document.getElementById(`res_${qi}`);
          const user = getUserAnswer(q, qi);
          if (isCorrect(q, user)) {
            correct++;
            res.textContent = "✔ Đúng";
            res.className = "result r-good";
          } else {
            res.textContent = "✘ Sai";
            res.className = "result r-bad";
          }
        });
        document.getElementById("meta").textContent =
          `${correct}/${WORK.length} đúng`;
      }

      document.getElementById("btnCheck").addEventListener("click", checkAll);
      document
        .getElementById("btnReset")
        .addEventListener("click", () => reset(true));
      let keyVisible = false;
      document.getElementById("btnToggleKey").addEventListener("click", () => {
        keyVisible = !keyVisible;
        WORK.forEach((q, qi) => {
          if (keyVisible) showKey(q, qi);
          else {
            const r = document.getElementById(`res_${qi}`);
            r.textContent = "";
            r.className = "result";
          }
        });
      });

      reset(true);
    </script>
  </body>
</html>
