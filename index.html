<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Chọn Bài Làm</title>
    <style>
      /* RESET + MOBILE FIRST */
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #89f7fe, #66a6ff);
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
      }

      /* CONTAINER */
      .container {
        width: 100%;
        max-width: 900px;
        background: rgba(255, 255, 255, 0.88);
        padding: 28px 20px;
        border-radius: 20px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(6px);
        text-align: center;
      }

      /* TITLE */
      h1 {
        margin: 0;
        font-size: clamp(24px, 5vw, 34px);
        color: #1f2937;
        letter-spacing: 1px;
      }

      .subtitle {
        margin: 10px 0 28px;
        font-size: clamp(14px, 3.5vw, 16px);
        color: #4b5563;
      }

      /* GRID MENU */
      .menu {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }

      /* CARD */
      .card {
        background: #ffffff;
        padding: 20px 10px;
        border-radius: 16px;
        text-decoration: none;
        color: #111827;
        font-weight: 700;
        font-size: clamp(16px, 4vw, 18px);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        transition: transform 0.25s ease, box-shadow 0.25s ease,
          background 0.25s ease;
      }

      /* TEXT SUB */
      .card span {
        display: block;
        margin-top: 6px;
        font-size: clamp(12px, 3.5vw, 13px);
        font-weight: 500;
        color: #6b7280;
      }

      /* HOVER (CHỈ DÙNG KHI CÓ CHUỘT) */
      @media (hover: hover) {
        .card:hover {
          transform: translateY(-6px) scale(1.05);
          box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
          background: linear-gradient(135deg, #ffecd2, #fcb69f);
        }

        .card:hover span {
          color: #374151;
        }
      }

      /* TABLET */
      @media (min-width: 640px) {
        .menu {
          grid-template-columns: repeat(3, 1fr);
          gap: 20px;
        }

        .container {
          padding: 36px 40px;
        }
      }

      /* LAPTOP & DESKTOP */
      @media (min-width: 1024px) {
        .menu {
          grid-template-columns: repeat(4, 1fr);
          gap: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Chủ nghĩa xã hội</h1>
      <div class="menu">
        <a href="./Mau1bai1.html" class="card">Bài 1</a>
        <a href="./Mau1bai2.html" class="card">Bài 2</a>
        <a href="./Mau1bai3.html" class="card">Bài 3</a>
        <a href="./Mau1bai4.html" class="card">Bài 4</a>
        <a href="./Mau1bai5.html" class="card">Bài 5</a>
        <a href="./Mau1bai6.html" class="card">Bài 6</a>
      </div>
    </div>
  </body>
</html>
